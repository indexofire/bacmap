[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bacmap"
version = "0.1.2"
description = "Local pathogen genome analysis system with built-in agent layer (architecture-frozen-v1 ADR-01..20)"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "indexofire", email = "indexofire@gmail.com" },
]

dependencies = [
    "biopython>=1.83",
    "pydantic>=2.0",
    "pyrodigal>=3.0",
    "mappy>=2.24",
    "pyyaml>=6.0",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "importlinter>=2.0",
]

[project.scripts]
bacmap = "bacmap.interfaces.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bacmap"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F/W 基础 + I 导入排序 + UP 现代化 + B bugbear + C90 复杂度 + SIM 简化
# + RUF ruff 专属 + S 安全（bandit；安全敏感项目应启用）。
select = ["E", "F", "W", "I", "UP", "B", "C90", "SIM", "RUF", "S"]
# RUF001/002/003：中文文档/字符串中的全角标点与中文引号是本项目常态（双语制）。
# S603/S607：包装外部生信 CLI（ADR-20）是核心模式，参数不含用户数据；
#   partial path 经 PATH 解析为有意行为（工具由 pixi 环境固定）。
ignore = ["RUF001", "RUF002", "RUF003", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# 遗留迁移脚本（HTML/CSS 模板行超长，源仓库 scripts/ 同样不参与 lint）
"src/bacmap/tools/_scripts/*" = ["E501", "C901"]
# Snakemake script: 上下文注入 snakemake 全局对象（F821 误报）；迁移遗留长行
"src/bacmap/workflow/scripts/*" = ["E501", "F821", "F841", "C901"]
# 测试：断言即语言（S101）；样例数据/monkeypatch 面大
"tests/*" = [
    "S101", "S105", "S106", "S108", "S110", "S311", "S603", "S607",
    "B011", "B017", "E501",
]
# PTY 冒烟脚本：非交互面（S606 无 shell 启动进程为冒烟目的本身）
"src/bacmap/interfaces/tui/pty_smoke.py" = ["S606", "C901"]

[tool.ruff.lint.mccabe]
# 复杂度上限：v1.4.28 重构后全仓无超线函数（原 create_app/samtools_op/seq_ops/
# _extract_genotype 四个热点已拆解）；新代码不得超线。
max-complexity = 15

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# 覆盖率：基线门槛只升不降（规则 7 精神的度量面）。
# 忽略 Snakemake 运行时契约脚本与遗留迁移脚本（它们经真实管线冒烟覆盖）。
[tool.coverage.run]
source = ["bacmap"]
omit = [
    "*/workflow/scripts/*",
    "*/tools/_scripts/*",
]

[tool.coverage.report]
# 门槛只升不降：2026-10 首次全量测量 87%，取 85 起步（留环境抖动余量）。
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
# Snakemake 脚本注入全局 snakemake 对象，非普通模块；由运行时契约保证。
exclude = ['^src/bacmap/workflow/scripts/']

# 领域层（core/store）函数签名必须完整标注——信任边界的 pydantic 模型
# 与 SQLite 访问都集中在这两层（ADR-02 下层）。上层逐步跟进。
[[tool.mypy.overrides]]
module = ["bacmap.core.*", "bacmap.store.*"]
disallow_untyped_defs = true

# ADR-02：依赖方向契约。core/store/tools 不得导入 agent/tasks/interfaces/workflow。
[tool.importlinter]
root_packages = ["bacmap"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layers never import upper layers"
type = "forbidden"
source_modules = [
    "bacmap.core",
    "bacmap.store",
    "bacmap.tools",
]
forbidden_modules = [
    "bacmap.agent",
    "bacmap.application",
    "bacmap.tasks",
    "bacmap.interfaces",
    "bacmap.workflow",
]

# v1.5 应用服务层：不得依赖接口层，也不得依赖智能体层（C3：无 LLM 时计划闭环可用）。
[[tool.importlinter.contracts]]
name = "Application layer stays below interfaces and independent of agent"
type = "forbidden"
source_modules = ["bacmap.application"]
forbidden_modules = ["bacmap.interfaces", "bacmap.agent"]

# ADR-02（v1.5 契约化）：只有 bacmap.agent.llm 可以直接导入 LLM 库。
# allow_indirect_imports：经 agent.llm 封装的间接依赖是被允许的设计本身。
# bacmap.workflow 为命名空间包（无 __init__，grimp 不可见），不列入源模块。
[[tool.importlinter.contracts]]
name = "Only bacmap.agent.llm imports LLM libraries"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "bacmap.application",
    "bacmap.config",
    "bacmap.core",
    "bacmap.store",
    "bacmap.tools",
    "bacmap.tasks",
    "bacmap.interfaces",
    "bacmap.agent.interpret",
    "bacmap.agent.roledef",
]
forbidden_modules = ["pydantic_ai", "openai"]

# ADR-02：只有 bacmap.tasks.engine 可以导入 DBOS。
[[tool.importlinter.contracts]]
name = "Only bacmap.tasks.engine imports DBOS"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "bacmap.application",
    "bacmap.config",
    "bacmap.core",
    "bacmap.store",
    "bacmap.tools",
    "bacmap.agent",
    "bacmap.interfaces",
    "bacmap.tasks.spec",
    "bacmap.tasks.gates",
]
forbidden_modules = ["dbos"]

# ADR-02/ADR-12：MCP 只作服务端对外（仅 bacmap.interfaces.mcp 导入 mcp 服务端 SDK）；
# MCP 客户端代码仅允许出现在 bacmap.store.knowledge 与 bacmap.agent.llm。
# import-linter 不支持外部子包（mcp.client），"interfaces.mcp 不得导入 mcp.client"
# 与命名空间包 bacmap.workflow 由 tests/unit/test_import_boundaries.py 补足。
[[tool.importlinter.contracts]]
name = "MCP SDK only in interfaces.mcp, store.knowledge and agent.llm"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "bacmap.application",
    "bacmap.config",
    "bacmap.core",
    "bacmap.tools",
    "bacmap.tasks",
    "bacmap.interfaces.views",
    "bacmap.interfaces.cli",
    "bacmap.interfaces.tui",
    "bacmap.interfaces.web",
    "bacmap.agent.interpret",
    "bacmap.agent.roledef",
]
forbidden_modules = ["mcp"]
