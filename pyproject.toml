[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bacmap"
version = "0.1.0"
description = "Local pathogen genome analysis system with built-in agent layer (architecture-frozen-v1 ADR-01..20)"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "indexofire", email = "indexofire@gmail.com" },
]

dependencies = [
    "biopython>=1.83",
    "pydantic>=2.0",
    "pyrodigal>=3.0",
    "mappy>=2.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "importlinter>=2.0",
]

[project.scripts]
bacmap = "bacmap.interfaces.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bacmap"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# 遗留迁移脚本（HTML/CSS 模板行超长，源仓库 scripts/ 同样不参与 lint）
"src/bacmap/tools/_scripts/*" = ["E501"]
# Snakemake script: 上下文注入 snakemake 全局对象（F821 误报）；迁移遗留长行
"src/bacmap/workflow/scripts/*" = ["E501", "F821", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# ADR-02：依赖方向契约。core/store/tools 不得导入 agent/tasks/interfaces/workflow。
[tool.importlinter]
root_packages = ["bacmap"]

[[tool.importlinter.contracts]]
name = "Domain layers never import upper layers"
type = "forbidden"
source_modules = [
    "bacmap.core",
    "bacmap.store",
    "bacmap.tools",
]
forbidden_modules = [
    "bacmap.agent",
    "bacmap.tasks",
    "bacmap.interfaces",
    "bacmap.workflow",
]
