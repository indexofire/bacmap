[workspace]
authors = ["indexofire <indexofire@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "bacmap"
platforms = ["linux-64"]
version = "0.1.0"

# 环境分两层：default = 运行时（Python + 域依赖）；dev = 开发工具。
# 生信 CLI 工具与 Snakemake 9 在迁移第 4 步（workflow 层）加入，避免骨架阶段拖入 4GB 依赖。
[tasks]
test = { cmd = "pytest", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }
lint = { cmd = "ruff check src tests", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }
contracts = { cmd = "lint-imports", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }

[dependencies]
python = "3.12.*"
samtools = ">=1.20"
bwa = ">=0.7.17"
minimap2 = ">=2.28"
bcftools = ">=1.20"
blast = ">=2.16"
bedtools = ">=2.31"
seqkit = "2.13.*"
sra-tools = ">=3.0"
spades = ">=3.15"
openjdk = ">=11,<17"
shovill = "1.1.0.*"
snakemake = "9.27.*"
pandas = ">=2.3"
fastp = "1.3.5.*"
abricate = ">=1.4.0,<2"
ncbi-amrfinderplus = "3.12.*"
iqtree = "3.1.2.*"
prodigal = ">=2.6.3,<3"
kma = ">=1.4"
ncbi-datasets-cli = ">=16"
skani = "0.3.*"
kraken2 = ">=2.1"
bracken = ">=2.9"
mash = ">=2.3"
mummer4 = "*"

[pypi-dependencies]
gmlst = "==0.5.5"
biopython = ">=1.83"
sistr-cmd = ">=1.1.3,<2"
setuptools = "<81"
pydantic = ">=2.0"
pyrodigal = ">=3.0"
mappy = ">=2.24"
pyhmmer = ">=0.10"
pyyaml = ">=6.0"
sourmash = ">=4.8"
gapit = "==0.5.4"
dbos = ">=2.0"
mcp = ">=2.3,<3"
fastapi = ">=0.110"
uvicorn = ">=0.29"
jinja2 = ">=3.1"
httpx = ">=0.27"
pydantic-ai-slim = { version = ">=2.0,<3", extras = ["openai"] }
gside = "==0.1.1"
bacmap = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=4.0"
ruff = ">=0.5"
mypy = ">=1.10"
import-linter = ">=2.0"
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"

[feature.dev.tasks]
docs-build = { cmd = "mkdocs build" }

[environments]
dev = ["dev"]
