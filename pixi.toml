[workspace]
authors = ["indexofire <indexofire@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "bacmap"
platforms = ["linux-64"]
version = "0.1.5"

# 环境分两层：default = 运行时（Python + 域依赖）；dev = 开发工具。
# 生信 CLI 工具与 Snakemake 9 在迁移第 4 步（workflow 层）加入，避免骨架阶段拖入 4GB 依赖。
[tasks]
test = { cmd = "pytest", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }
lint = { cmd = "ruff check src tests", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }
contracts = { cmd = "lint-imports", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }

[dependencies]
python = "3.12.*"
samtools = ">=1.20"
bwa = ">=0.7.17"
minimap2 = ">=2.28"
bcftools = ">=1.20"
blast = ">=2.16"
bedtools = ">=2.31"
seqkit = "2.13.*"
sra-tools = ">=3.0"
spades = ">=3.15"
openjdk = ">=11,<17"
shovill = "1.1.0.*"
snakemake = "9.27.*"
pandas = ">=2.3"
# sistr-cmd（bioconda）要求 numpy<2；显式钉住防止未来全量 pixi update 解到 numpy 2.x 破坏 sistr。
numpy = "<2"
# gspec 0.10 的 click CLI 需要 click>=8.2；>=8.5 与 gside/gspec 当前签名一致。
click = ">=8.5"
fastp = "1.3.5.*"
ncbi-amrfinderplus = ">=4.2.7,<5"
iqtree = "3.1.2.*"
prodigal = ">=2.6.3,<3"
kma = ">=1.4"
ncbi-datasets-cli = ">=16"
skani = "0.3.*"
kraken2 = ">=2.1"
bracken = ">=2.9"
mash = ">=2.3"
mummer4 = "*"
shigatyper = ">=2.0.5,<3"
flye = ">=2.9.5,<3"
unicycler = ">=0.5.1,<0.6"
bakta = ">=1.12,<2"
eggnog-mapper = ">=2.1.12,<3"

[pypi-dependencies]
gmlst = "==0.6.1"
biopython = ">=1.83"
sistr-cmd = ">=1.1.3,<2"
setuptools = "<81"
pydantic = ">=2.0"
pyrodigal = ">=3.0"
mappy = ">=2.24"
pyhmmer = ">=0.10"
pyyaml = ">=6.0"
sourmash = ">=4.8"
gspec = "==0.10.2"
# gside 0.2+ 与 gspec 0.10 的可选 gseek 引擎共同使用 gseek 0.10.5；
# 显式钉住，避免 extras 缺失时落回旧适配器。
gseek = "==0.10.5"
dbos = ">=2.0"
mcp = ">=2.3,<3"
fastapi = ">=0.110"
uvicorn = ">=0.29"
jinja2 = ">=3.1"
httpx = ">=0.27"
pydantic-ai-slim = { version = ">=2.0,<3", extras = ["openai"] }
gside = "==0.2.3"
# mNGS 宏基因组分析与监测报告（可选依赖；不进入默认分析路径）。
gmeta = "==0.1.0"
textual = ">=0.80"
bacmap = { path = ".", editable = true }
quast = ">=5.2.0, <6"

[feature.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=4.0"
ruff = ">=0.5"
mypy = ">=1.10"
import-linter = ">=2.0"

# mkdocs 走 pypi：conda-forge 的 mkdocs 1.6.x 钉 click<8.3，与 gspec 0.10.x
# 所需的 click>=8.5 冲突；pypi 版无此上界（依赖重组）。
[feature.dev.pypi-dependencies]
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocs-static-i18n = ">=1.2"

[feature.dev.tasks]
docs-build = { cmd = "mkdocs build" }
typecheck = { cmd = "mypy src/bacmap", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }
coverage = { cmd = "pytest --cov=bacmap --cov-report=term-missing", env = { PYTHONPATH = "$PIXI_PROJECT_ROOT/src" } }

# Vue 3 控制台构建（ADR-01：Node 只在构建期；独立环境避免与主环境 libzlib 冲突）。
[feature.web.dependencies]
nodejs = ">=22"

[feature.web.tasks]
web-install = { cmd = "npm --prefix frontend ci --no-audit --no-fund" }
web-build = { cmd = "npm --prefix frontend run build" }
web-dev = { cmd = "npm --prefix frontend run dev" }

# 重组检测（ADR-20：外部工具；不进默认环境，按需 `pixi run -e recomb ...`）。
# 缺失时重组步骤写 status=skipped（不静默、不改判定）。
[feature.recomb.dependencies]
gubbins = ">=3.3"

[environments]
dev = ["dev"]
# Vue 3 控制台构建环境：只装 Node，不继承主环境（避免 libzlib 求解冲突）。
web = { features = ["web"], no-default-feature = true }
# 独立求解（不继承默认依赖）：gubbins 需 iqtree 2.0.3.*，与默认 iqtree 3.1.2.* 冲突。
recomb = { features = ["recomb"], no-default-feature = true }
