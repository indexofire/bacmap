site_name: bacmap
site_description: Local pathogen genome analysis system (architecture-frozen v1.9.3)
site_author: indexofire
site_url: https://indexofire.github.io/bacmap/

repo_name: indexofire/bacmap
repo_url: https://github.com/indexofire/bacmap

docs_dir: docs
site_dir: site

plugins:
  - search
  - i18n:
      docs_structure: suffix
      # mkdocs-static-i18n configures Material's header language selector
      # (extra.alternate) and the per-language search stemmer automatically.
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Getting Started: 快速开始
            Guide: 使用指南
            Concepts: 核心概念
            Operations: 运维
            Reference: 参考
            Development: 开发
            Installation: 安装
            Configuration: 配置
            Tutorial: 教程
            Interfaces: 界面
            Tasks & Gates: 任务与门
            Data & Identity: 数据与身份
            Agents & Plans: 智能体与计划
            Results & Evidence: 结果与证据
            Architecture: 架构
            Data Model: 数据模型
            Task Engine & DBOS: 任务引擎与 DBOS
            Security: 安全
            Frozen Design: 冻结设计
            Health and retention: 体检与保留
            Backup and restore: 备份与恢复
            Upgrades and migrations: 升级与迁移
            Troubleshooting: 排障
            CLI: 命令行
            MCP: MCP
            HTTP API: HTTP API
            Configuration Reference: 配置参考
            Tools: 工具

theme:
  name: material
  language: en
  # Desktop: top tabs + right-hand TOC. The primary sidebar is hidden by
  # stylesheets/extra.css; tablet/mobile keep the drawer (same as gside).
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Tutorial: getting-started/tutorial.md
  - Guide:
      - guide/index.md
      - Interfaces: guide/interfaces.md
      - Tasks & Gates: guide/tasks.md
      - Data & Identity: guide/data.md
      - Agents & Plans: guide/agent-plans.md
      - Results & Evidence: guide/results.md
  - Concepts:
      - concepts/index.md
      - Architecture: concepts/architecture.md
      - Data Model: concepts/data-model.md
      - Task Engine & DBOS: concepts/task-engine.md
      - Security: concepts/security.md
      - Frozen Design: concepts/frozen-design.md
  - Operations:
      - operations/index.md
      - Health and retention: operations/health.md
      - Backup and restore: operations/backup.md
      - Upgrades and migrations: operations/upgrades.md
      - Troubleshooting: operations/troubleshooting.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - MCP: reference/mcp.md
      - HTTP API: reference/api.md
      - Configuration Reference: reference/configuration.md
      - Tools: reference/tools.md
  - Development:
      - development/index.md

markdown_extensions:
  - tables
  - fenced_code
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
