site_name: bacmap
site_description: Local pathogen genome analysis system (architecture-frozen v1.9.3)
site_author: indexofire
site_url: https://indexofire.github.io/bacmap/

repo_name: indexofire/bacmap
repo_url: https://github.com/indexofire/bacmap

docs_dir: docs
site_dir: site

plugins:
  - search
  - i18n:
      docs_structure: suffix
      # mkdocs-static-i18n configures Material's header language selector
      # (extra.alternate) and the per-language search stemmer automatically.
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            Installation: 安装
            Configuration: 配置
            Tutorial: 教程
            Usage: 使用
            Tools: 工具
            Operations: 运维
            Harnesses: 智能体
            Architecture: 架构

theme:
  name: material
  language: en
  # Desktop: top tabs + right-hand TOC. The primary sidebar is hidden by
  # stylesheets/extra.css; tablet/mobile keep the drawer (same as gside).
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Tutorial: tutorial.md
  - Usage: usage.md
  - Tools: tools.md
  - Operations: operations.md
  - Harnesses: harnesses.md
  - Architecture: architecture-frozen-v1.md

markdown_extensions:
  - tables
  - fenced_code
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
