# bacmap 分析流程配置
# 路径可通过环境变量覆盖: BACMAP_RESULTS_DIR, BACMAP_DATA_DIR

# 分析线程数：匹配本工作站 16 核；小内存/共享机器可调低
threads: 16
iqtree_seed: 42
# 运行记录（ADR-18）：seeds 覆盖/扩展固定种子；nondeterministic_steps 列出
# 无法固定随机性、需在运行记录中标记的步骤名。留空即取默认。
seeds: {}
nondeterministic_steps: []
workdir: "results"
project_root: "../.."

# 物种鉴定方法（species-id 专项）：marker 靶基因（默认）；
# 可选 marker/ani/mash/sourmash/gtdbtk/all；兼容旧别名 simple/panel/skani_gtdb/
# mash_refseq/standard。数据库缺失时该档落空（不崩溃），本地需
# `gside db setup --tier <tier>`。Kraken2 reads 级预筛独立开关。
species_mode: "marker"
# 升级阶梯（v1.10.18）：起始档未定种时按 marker→ani→mash→sourmash→gtdbtk→all 升档。
species_escalation: false
species_mode_max: "all"
kraken2_prefilter: false

samples_file: "config/samples.tsv"

# 用户/项目级物种→工具参考数据覆盖（gspec 库 / gmlst 模式与 scheme）。
# 空 = $BACMAP_HOME/config/tool_selection.yaml（旧 db_selection.yaml 兼容）。
# 也可由 BACMAP_TOOL_SELECTION 环境变量或 --config tool_selection=PATH 指定。
# 生成/校验：`bacmap selection options|select|show|validate`。
tool_selection: ""
# 旧键（v1.4.40 兼容）：仍被读取，等价于 gspec-only 覆盖。
db_selection: ""

databases:
  invA_ref: "../../data/reference/species/markers.fasta"
  amrfinderplus_db: "../../data/db/amrfinderplus"
  vfdb: "vfdb"
  card: "card"
  plasmidfinder: "plasmidfinder"
  resfinder: "resfinder"
  # v1.10.19：vpara_virulence 条目随 vpara.smk（v1.4.41 删除）一并清理——
  # 弧菌毒力/O-K/毒力岛改走 pathogens.yaml 的 gspec_screens（vpa_vf/vpa_ok/
  # vpa_pai）经通用 gspec_typing 规则路由。

tools:
  fastp:
    qualified_quality_phred: 20
    length_required: 50
    detect_adapter_for_pe: true
  spades:
    min_contig_len: 200
    cov_cutoff: 2
  shovill:
    minlen: 500
    ram: 8
    depth: 100
  flye:
    minlen: 1000
    # ONT 读类型：hq = R10.4.1 SUP（Q20+，默认）；raw = 旧 R9.4 低质量
    ont_mode: "hq"
    # genome_size：留空则由 flye 2.9+ 自动估计（推荐，细菌基因组准确）；
    # 显式设置仅用于特殊场景（如极大基因组或估计偏差大时）
    # genome_size: "5m"
  unicycler:
    mode: "normal"
  trycycler:
    # reconcile --min_identity 为百分比（Trycycler 默认 98.0）
    min_identity: 98.0
  # 细菌基因组注释（v1.10.14）：QUAST → Bakta → eggNOG-mapper。
  # 数据库路径默认在 $BACMAP_HOME/refs/，可用环境变量覆盖：
  #   BACMAP_BAKTA_DB、BACMAP_EGGNOG_DATA_DIR、BACMAP_ANNOTATION_ENABLED=0
  annotation:
    enabled: true
    bakta:
      # 空串 = $BACMAP_HOME/refs/bakta/db-light
      db: ""
      min_contig_length: 1
      skip_plot: true
    eggnog:
      # 空串 = $BACMAP_HOME/refs/eggnog
      data_dir: ""
      tax_scope: "Bacteria"
      mode: "diamond"
      # 速度档位（v1.10.19）：实测 sensitive+迭代在 8 线程上仅 diamond 就
      # >50 分钟/基因组，不可用。默认 mid-sensitive + 关闭迭代（肠杆菌等
      # 覆盖好的物种注释损失可忽略，diamond 阶段 ~3-5x 提速）。
      # 需要极限灵敏度时改 sensmode: "sensitive" 且 iterate: true。
      # usemem: true 让 diamond 库常驻内存（批量时省重复读盘，需 ~10G 空闲内存）。
      sensmode: "mid-sensitive"
      iterate: false
      usemem: false
  quast:
    min_contig: 500
  blastn:
    evalue: 1e-50
    word_size: 28
    min_identity: 90
    min_coverage: 80
  mlst:
    scheme: "auto"
  sistr:
    threads: 4
  amrfinderplus:
    organism: "Salmonella"
    min_coverage: 0.5
  abricate:
    # 历史键名：实际用于 gspec screen 的 card/vfdb/plasmidfinder 阈值
    minid: 80
    mincov: 60

# cgMLST per-sample typing + cohort trace-back (EnteroBase schemes via gmlst).
# Threshold values are published EnteroBase HierCC values; see
# src/hermes_bacmap/skills/interpret-results/SKILL.md "cgMLST Trace-back
# Interpretation" for the full per-species rubric and citations.
cgmlst:
  run_cgmlst_cohort: false
  # 阈值键 = 三字母物种码（core/species_codes.py）；查表由 species_code 归一，
  # 故 Salmonella/E.coli/Escherichia coli 等写法都命中同一键。
  thresholds:
    # source: Zhou 2020 Genome Res (HierCC HC5/HC10); Ferrato 2023 Frontiers Microbiol
    SAL:
      outbreak_allele_dist: 10  # HC5/HC10 outbreak boundary (Zhou 2020)
      clonal_allele_dist: 3     # ST11/ST34 clonal sub-threshold (Ferrato 2023)
      related_allele_dist: 50   # HierCC HC50 (Zhou 2020)
    # source: Emerjean 2025 CDC EID (HC5 screen); Zhou 2020 Genome Res (HC50)
    ECO:
      outbreak_allele_dist: 5   # HC5 general screen (Emerjean 2025)
      related_allele_dist: 50   # HierCC HC50 (Zhou 2020)
      serotype_specific:        # Emerjean 2025 CDC EID
        "O26:H11": 8
        "O157:H7": 16
        "O103:H2": 5
        "O80:H2": 9
    # source: Hawkey 2021 Nat Commun; Weill 2022 (S. sonnei UNRELIABLE -> SNV)
    SHI:
      outbreak_allele_dist: 5   # HC5; S. sonnei UNRELIABLE -> SNV confirm
      related_allele_dist: 50   # HierCC HC50 (Zhou 2020)
    # source: Achtman 2022 bioRxiv -- only HC1090 species boundary published
    VPA:
      outbreak_allele_dist: null    # NO published threshold; verdict=UNDETERMINED
      related_allele_dist: null     # local calibration required
  projection:
    top_n: 10
