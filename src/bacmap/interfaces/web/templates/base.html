<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>bacmap 任务</title>
<style>
 body { font-family: system-ui, sans-serif; margin: 2rem; max-width: 960px; color: #1f2937; }
 table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; }
 td, th { border: 1px solid #d1d5db; padding: 6px 10px; text-align: left; font-size: 0.92em; }
 .state-running { color: #2563eb; } .state-succeeded { color: #16a34a; font-weight: 600; }
 .state-failed, .state-cancelled { color: #dc2626; } .state-awaiting_approval { color: #d97706; font-weight: 600; }
 .state-pending { color: #6b7280; }
 form.p label { display: block; margin: 6px 0 2px; font-size: 0.9em; color: #374151; }
 form.p input, form.p textarea, form.p select { width: 100%; max-width: 480px; padding: 4px 6px; }
 form.p button { margin-top: 8px; padding: 5px 16px; }
 code { background: #f3f4f6; padding: 1px 5px; border-radius: 3px; font-size: 0.88em; word-break: break-all; }
 a { color: #2563eb; }
</style>
</head>
<body>
<h1><a href="/" style="text-decoration:none;color:inherit">bacmap 任务</a></h1>
{% block content %}{% endblock %}
</body>
</html>
