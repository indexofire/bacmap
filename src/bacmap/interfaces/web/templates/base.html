<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="bacmap 本地病原菌基因组分析任务台——任务提交、进度跟踪与审批签名。">
<title>{% block title %}bacmap 任务台{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237170ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='22 12 18 12 15 21 9 3 6 12 2 12'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="/">
      <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
      <span class="brand__name">bacmap</span>
      <span class="brand__tag">本地任务台</span>
    </a>
    <nav class="topnav" aria-label="主导航">
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>任务</a>
      <a href="/assistant" {% if request.url.path.startswith('/assistant') %}aria-current="page"{% endif %}>助手</a>
      <a href="/overview" {% if request.url.path == '/overview' %}aria-current="page"{% endif %}>系统</a>
      <a href="/samples" {% if request.url.path.startswith('/samples') %}aria-current="page"{% endif %}>样本</a>
    </nav>
    <span class="topbar__meta" title="ADR-16：数据不出本地网络">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
      数据不出网
    </span>
  </div>
</header>
<main id="main" class="page">
{% block content %}{% endblock %}
</main>
</body>
</html>
