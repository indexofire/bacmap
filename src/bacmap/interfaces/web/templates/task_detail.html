{% extends "base.html" %}
{% block title %}任务 {{ task_id[:12] }} · bacmap{% endblock %}
{% block content %}
<nav class="crumbs" aria-label="面包屑">
  <a class="crumbs__link" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    任务列表
  </a>
  <span class="crumbs__sep" aria-hidden="true">/</span>
  <span class="crumbs__here">任务 {{ task_id[:12] }}…</span>
</nav>
<header class="detailhead">
  <h1 class="detailhead__title">任务详情</h1>
  <p class="detailhead__id mono">{{ task_id }}</p>
</header>
<div id="status" class="live" aria-live="polite">
{% include "task_fragment.html" %}
</div>
<script>
(function () {
  var box = document.getElementById('status');
  if (!box) return;
  var TERMINAL = ['succeeded', 'failed', 'cancelled'];
  var last = null;
  var before = null;

  function currentState() {
    var el = box.querySelector('[data-state]');
    return el ? el.getAttribute('data-state') : null;
  }

  // 审批表单正在编辑（聚焦或有未提交修改）时跳过本轮，避免轮询覆盖输入。
  function formBusy() {
    var ae = document.activeElement;
    if (ae && box.contains(ae)) return true;
    var controls = box.querySelectorAll('input, textarea, select');
    for (var i = 0; i < controls.length; i++) {
      var el = controls[i];
      if (el.type === 'submit' || el.type === 'button') continue;
      if (typeof el.value === 'string' && el.value !== el.defaultValue) return true;
      var opts = el.selectedOptions || [];
      for (var j = 0; j < opts.length; j++) {
        if (!opts[j].defaultSelected) return true;
      }
    }
    return false;
  }

  function schedule() { setTimeout(tick, 2000); }

  function tick() {
    if (formBusy()) { schedule(); return; }
    fetch('/tasks/{{ task_id }}/fragment')
      .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
      .then(function (html) {
        if (html !== last) {
          last = html;
          box.innerHTML = html;
          var after = currentState();
          if (after !== before) {
            // 仅状态真实变化时做淡入（动效有义；内容未变不写 DOM，aria-live 不重复播报）
            box.classList.remove('live--swap');
            void box.offsetWidth;
            box.classList.add('live--swap');
            before = after;
          }
          if (TERMINAL.indexOf(after) !== -1) return; // 终态：停止轮询
        }
        schedule();
      })
      .catch(function () { schedule(); });
  }

  before = currentState();
  tick();
})();
</script>
{% endblock %}
