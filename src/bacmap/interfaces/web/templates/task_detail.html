{% extends "base.html" %}
{% block title %}任务 {{ task_id[:12] }} · bacmap{% endblock %}
{% block content %}
<nav class="crumbs" aria-label="面包屑">
  <a class="crumbs__link" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    任务列表
  </a>
  <span class="crumbs__sep" aria-hidden="true">/</span>
  <span class="crumbs__here">任务 {{ task_id[:12] }}…</span>
</nav>
<header class="detailhead">
  <h1 class="detailhead__title">任务详情</h1>
  <p class="detailhead__id mono">{{ task_id }}</p>
</header>
<div id="status" class="live" aria-live="polite" data-task-id="{{ task_id }}">
{% include "task_fragment.html" %}
</div>
<script src="/static/js/task_poll.js" defer></script>
{% endblock %}
