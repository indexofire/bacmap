name: assistant
task_types: [analyze, curate, mine, write]
min_model_tier: T2
# cloud 自 v1.4.28 起允许：会话工具带由 build_session 按 cloud_max_data_class 裁剪
# （D4 元数据/检验、D3 数据集查看与沙箱工具不进云端会话），会话级别 ≤D2；
# D3/D4 载荷仍被网关按 ADR-16 拦截——本字段只放行位置，不放宽数据红线。
allowed_locations: [local, lan, cloud]
max_data_class: D4
trust_layer: L2
tools:
  - bio_list_samples
  - bio_get_result
  - bio_search_samples
  - bio_query_metadata
  - bio_review_flags
  - bio_inspect_dataset
  - bio_list_reference_genomes
  - bio_diagnose
  - bio_compare_runs
  - sandbox_run
  - sandbox_shell
fs_scope:
  read: ["${GOM_EXPORT}", "${RESULTS_DIR}"]
  write: ["${TASK_WORKSPACE}"]
network: false
