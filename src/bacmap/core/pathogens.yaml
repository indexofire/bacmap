# 病原注册表（码为准，v1.4.16）——所有 rule / 分析模块的病原配置唯一来源。
#
# 语义约定：
# - pathogens 的键 = **三字母物种码**（core/species_codes.py），全系统统一键；
#   覆盖 gside D1_marker 的 40 条物种标签（见 species_codes.GSIDE_MARKER_LABELS）。
# - marker 基因归 gside（鉴定外部化，ADR-20）；bacmap 不再保存 marker_genes。
# - samples.tsv `species` 列**双接受**：码（SAL）或 gside 标签/显示名
#   （Salmonella / V_parahaemolyticus / E. coli）——由 registry.resolve() 归一。
# - 字段：
#     display_name        中文名（展示）
#     gside_labels        gside 接受的物种标签（含血清型变体）
#     mlst_scheme         gmlst typing mlst 方案（缺省 null）
#     cgmlst_scheme       gmlst typing cgmlst 方案（缺省 null）
#     amrfinder_organism  AMRFinderPlus -O（缺省 null → 不传 -O）
#     gapit_screens       gapit 数据库（种以下判定：DEC 致病型、血清群、K/O 位点…）
#     serotype_engine     血清型引擎（gapit 承接；占位待接）
#     snp_group           SNP cohort 分组名（仅当 snp_groups 已备参考基因组）
#     plan                分析计划开关：{snp, cgmlst, recombination}
#     enabled             false 则不进入任何查询表
# - snp_groups.ref 相对项目根解析；成员（species）由 pathogens 的 snp_group 派生。

pathogens:
  SAL:
    display_name: 沙门菌
    gside_labels: [Salmonella]
    mlst_scheme: salmonella_2
    cgmlst_scheme: senterica_2
    amrfinder_organism: Salmonella
    serotype_engine: sistr
    snp_group: salmonella
    plan: {snp: true, cgmlst: true, recombination: true}
  SHI:
    display_name: 志贺菌
    gside_labels: [Shigella_EIEC]
    mlst_scheme: ecoli_1
    cgmlst_scheme: ecoli_2
    amrfinder_organism: Escherichia
    snp_group: ecoli
    plan: {snp: true, cgmlst: true, recombination: false}
  ECO:
    display_name: 大肠埃希菌
    gside_labels: [DEC]
    mlst_scheme: ecoli_1
    cgmlst_scheme: ecoli_2
    amrfinder_organism: Escherichia
